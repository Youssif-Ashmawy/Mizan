<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mizan">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f5f2ec">
<title>Mizan — Spending & Goals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --card:#ffffff; --ink:#1c1b19; --muted:#6f6a62; --line:#e7e2d8;
  --accent:#1f6b52; --accent-soft:#e3efe9; --warn:#b4471b; --warn-soft:#f8e6dc;
  --bar:#1f6b52; --track:#ece7dd; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#131412; --card:#1d1e1b; --ink:#f1efe9; --muted:#a19c92; --line:#2e2f2b;
    --accent:#5fc59c; --accent-soft:#1f3a2f; --warn:#f08a5d; --warn-soft:#3d241a;
    --bar:#5fc59c; --track:#2a2b27; --shadow:none; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 24px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.brand{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)} .dot.off{background:var(--warn)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthnav b{font-size:17px;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:18px;cursor:pointer}
.iconbtn:disabled{opacity:.35}
.big{font-family:'Fraunces',serif;font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.big small{font-family:'DM Sans';font-size:15px;font-weight:500;color:var(--muted);margin-right:4px;letter-spacing:0}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.up{color:var(--warn)} .down{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat .l{font-size:11.5px;color:var(--muted)} .stat .v{font-weight:600;font-size:15px;margin-top:2px}
.meter{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--bar);border-radius:6px}
.meter i.over{background:var(--warn)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.catrow{padding:8px 0;cursor:pointer}
.catrow .name{display:flex;gap:8px;align-items:center;font-weight:500}
.catrow .amt{font-weight:600}
.catrow .pct{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.cbar{height:6px;background:var(--track);border-radius:4px;margin-top:6px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.trend{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend .b{width:100%;max-width:38px;background:var(--track);border-radius:6px 6px 3px 3px;min-height:3px}
.trend .b.cur{background:var(--bar)}
.trend .lab{font-size:11px;color:var(--muted)} .trend .val{font-size:10.5px;color:var(--muted)}
.tx{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.tx:first-child{border-top:none}
.tx .ic{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .m{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:600;text-align:right;white-space:nowrap}
.tx .a.inc{color:var(--accent)} .tx.dim{opacity:.55}
.daylabel{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:600;font-size:15px;padding:12px 16px;border-radius:14px;cursor:pointer;width:100%}
@media (prefers-color-scheme:dark){.btn{color:#0f1a15}}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:11px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.goal{padding:4px 0}
.goal+.goal{border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
.goal .t{display:flex;gap:10px;align-items:center}
.goal .em{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none}
.goal .nm{font-weight:600;font-size:16px}
.goal .eta{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
.steps{padding-left:20px} .steps li{margin:7px 0}
.steps code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--bg);padding:2px 5px;border-radius:6px}
pre.mono{display:block;padding:10px;white-space:pre-wrap;margin-top:6px}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{flex:1;border:none;background:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:20px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--ink)} nav.tabs button.on .i{filter:none;opacity:1}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:4px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.catgrid button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 4px;font-family:inherit;font-size:12px;cursor:pointer}
.catgrid button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.catgrid button .e{display:block;font-size:20px;margin-bottom:2px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;font-family:inherit;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rule{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rule:first-child{border-top:none}
.x{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 6px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
details.card>summary{list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card[open] .tog{visibility:hidden}
.badlist div{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:6px 0;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Mizan<span>.</span></div>
    <div class="sync" id="sync"><span class="dot"></span><span>On this phone</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-t="overview" class="on"><span class="i">📊</span>Overview</button>
  <button data-t="tx"><span class="i">🧾</span>Spending</button>
  <button data-t="goals"><span class="i">🎯</span>Goals</button>
  <button data-t="setup"><span class="i">⚙️</span>Import & setup</button>
</nav>

<script>
/* ===================== PARSER (bank SMS) ===================== */
const CATS={
  food:{n:'Food & Dining',e:'🍔'}, groceries:{n:'Groceries',e:'🛒'}, transport:{n:'Transport & Fuel',e:'🚗'},
  shopping:{n:'Shopping',e:'🛍️'}, bills:{n:'Bills & Telecom',e:'💡'}, subs:{n:'Subscriptions',e:'🔁'},
  health:{n:'Health',e:'💊'}, fun:{n:'Entertainment',e:'🎬'}, travel:{n:'Travel',e:'✈️'},
  education:{n:'Education',e:'📚'}, family:{n:'Family & Gifts',e:'🎁'}, people:{n:'Transfers to people',e:'👤'}, other:{n:'Other',e:'📦'},
  income:{n:'Income & Cashback',e:'💰'}, transfer:{n:'Transfer (not spending)',e:'🔄'}
};
const SPEND_CATS=['food','groceries','transport','shopping','bills','subs','health','fun','travel','education','family','people','other'];
const KEYWORDS=[
  ['groceries',/panda|بنده|tamimi|التميمي|danube|الدانوب|othaim|العثيم|carrefour|كارفور|lulu|لولو|nesto|farm\b|المزرعة|bin ?dawood|بن داود|manuel|hyper|super ?market|سوبر|تموينات|بقالة|أسواق|اسواق|grocery|baqala/i],
  ['food',/starbucks|ستاربكس|mcdonald|ماكدونالدز|kfc|albaik|البيك|kudu|كودو|herfy|هرفي|hunger ?station|هنقرستيشن|jahez|جاهز|mrsool|مرسول|to ?you|keeta|كيتا|the chefz|cafe|caf[eé]|coffee|كوفي|قهوة|كافيه|restaurant|مطعم|مطاعم|dunkin|tim hortons|barns|بارنز|half million|shawarma|شاورما|pizza|بيتزا|burger|برجر|bakery|مخبز|juice|عصير|dose|kaf|elixir|subway|domino|shake shack|five guys|chili|applebee|maestro|al ?tazaj|الطازج|bloom|sweets|حلويات/i],
  ['transport',/careem|كريم|uber|اوبر|bolt|jeeny|جيني|aldrees|الدريس|petromin|بترومين|sasco|ساسكو|naft|نفط|fuel|وقود|بنزين|محطة|gas station|parking|مواقف|saptco|metro|مترو|darb|درب|tamm|تم\b|car wash|غسيل/i],
  ['subs',/netflix|spotify|apple\.com|itunes|shahid|شاهد|osn|youtube|google|icloud|anghami|أنغامي|chatgpt|openai|disney|starzplay|tod\b|playstation plus|xbox|adobe|microsoft|canva|notion/i],
  ['bills',/\bstc\b|mobily|موبايلي|\bzain\b|زين|electricity|الكهرباء|\bsec\b|nwc|المياه|water|sadad|سداد فاتورة|virgin mobile|lebara|ليبارا|salam|سلام/i],
  ['health',/pharma|صيدلية|صيدليات|nahdi|النهدي|dawaa|الدواء|whites|hospital|مستشفى|clinic|عيادة|مجمع طبي|medical|dental|اسنان|lab\b|مختبر|gym|fitness|نادي|leejam|fitness time/i],
  ['fun',/cinema|سينما|vox|muvi|amc|empire|steam|playstation|nintendo|riyadh season|موسم|webook|ticket|تذاكر|boulevard|بوليفارد|bowling|game/i],
  ['travel',/saudia|السعودية للطيران|flynas|طيران ناس|flyadeal|طيران أديل|booking\.com|airbnb|hotel|فندق|marriott|hilton|almosafer|المسافر|wego|agoda|expedia|emirates|qatar airways|sar train|الخطوط/i],
  ['shopping',/amazon|أمازون|noon|نون|namshi|نمشي|shein|شي ان|jarir|جرير|extra|اكسترا|ikea|ايكيا|centrepoint|سنتربوينت|h&m|zara|زارا|max fashion|nike|adidas|apple store|virgin|سبيرو|saco|ساكو|ace\b|home ?centre|بيت|mall|مول|store|متجر|tabby|tamara|تمارا|تابي/i],
  ['education',/udemy|coursera|school|مدرسة|university|جامعة|book|مكتبة|kindle|duolingo/i],
];
function toAsciiDigits(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');}
function normMerchant(m){return toAsciiDigits(m||'').toLowerCase().replace(/[0-9#*\-_.,:;()\/\\]+/g,' ').replace(/\s+/g,' ').trim();}
function pad2(n){return String(n).padStart(2,'0');}
function localISO(dt){return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate())+'T'+pad2(dt.getHours())+':'+pad2(dt.getMinutes())+':'+pad2(dt.getSeconds());}

function parseSMS(raw, fallbackISO){
  let t=toAsciiDigits(String(raw||'')).replace(/[‎‏‪-‮]/g,'').replace(/\r/g,'').trim();
  if(!t) return null;
  // ignore: one-time codes (OTP / رمز), statements issued, payment confirmations
  if(/\bOTP\b|one[- ]?time (?:pass|code)|verification code|passcode|رمز|كلمة المرور المؤقتة|كلمة مرور لمرة واحدة/i.test(t)) return {skip:true};
  if(/كشف\s*(?:ال)?حساب|statement (?:is |has been )?(?:issued|ready|generated)/i.test(t)) return {skip:true};
  if(/تأكيد\s*(?:ال)?سداد/.test(t)) return {skip:true};
  // remove balance figures so only the transaction amount is read
  t=t.replace(/(?:ال)?رصيد(?:\s*(?:ال)?متاح)?\s*:?\s*(?:SAR|SR|ر\.?\s?س\.?|ريال)?\s*-?[0-9][0-9,]*(?:\.[0-9]+)?\s*(?:SAR|SR|ر\.?\s?س\.?|ريال)?/g,' ')
       .replace(/(?:avail(?:able)?\.?\s*)?bal(?:ance)?\.?\s*:?\s*(?:SAR|SR)?\s*-?[0-9][0-9,]*(?:\.[0-9]+)?\s*(?:SAR|SR)?/gi,' ');
  // amount
  let amount=null;
  const am=t.match(/(?:SAR|SR|ر\.?\s?س\.?|ريال)\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i)||t.match(/([0-9][0-9,]*(?:\.[0-9]+)?)\s*(?:SAR|SR|ر\.?\s?س|ريال)/i);
  if(am){amount=parseFloat(am[1].replace(/,/g,''));}
  if(amount==null||isNaN(amount)) return {skip:true};
  // type (order matters: card names contain "Cashback")
  let type=null, p2p=false;
  if(/credit\s*card\s*:?\s*payment|تأكيد السداد|تم سداد بطاقتك|سداد بطاقة|card payment received/i.test(t)) type='transfer';
  else if(/عكس|حوالة عكسية|reversal|reversed|refund|استرجاع|مرتجع/i.test(t)) type='refund';
  else if(/was used at|purchase|شراء|نقاط البيع|withdrawal|سحب|atm|pos\b|e-?commerce|online payment|دفع/i.test(t)) type='expense';
  else if(/استرداد نقدي|cashback\s+(?:of|added|credited)|حوالة واردة|incoming|received|credited|إيداع|ايداع|deposit|راتب|salary/i.test(t)) type='income';
  else if(/بين حساباتك|حساباتك الخاصة|own accounts?|between (?:your|my) accounts/i.test(t)) type='transfer';
  else if(/حوالة صادرة|outgoing|transfer|تحويل|حوالة/i.test(t)){ type='expense'; p2p=true; }
  else if(/mada|مدى|apple pay|visa|mastercard|card/i.test(t)) type='expense';
  if(!type) return {skip:true};
  // merchant
  let merchant='';
  const mm=t.match(/was used at\s+(.+?)\s+for\s+(?:SAR|SR)/i)
        ||t.match(/لدى\s*:?\s*([^\n]+?)(?:\s+بمبلغ|\s+من خلال|\s+بقيمة|\s*$)/m)
        ||t.match(/\bat\s*:?\s+([^\n]+?)(?:\s+on\s|\s+for\s|\s*$)/im)
        ||t.match(/(?:merchant|التاجر)\s*:?\s*([^\n]+)/i);
  if(mm) merchant=mm[1].trim().replace(/[.،,]+$/,'');
  if(p2p){
    const rm=t.match(/(?:^|\n)\s*(?:إلى|الى|للمستفيد|المستفيد|اسم المستفيد|To|Beneficiary(?:\s*name)?)\s*:\s*([^\n]+)/i)
          ||t.match(/(?:transfer(?:red)?|sent)\s+to\s+([^\n]+?)(?:\s+(?:on|from|for|amount|via)\b|[.,]|$)/im)
          ||t.match(/(?:إلى|الى)\s+([^\n]+?)(?:\s+بمبلغ|\s+من|\s*$)/m);
    merchant=rm?rm[1].replace(/\b(?:SA)?\d[\d\s*xX]{5,}\b/g,'').replace(/[*()]+/g,' ').replace(/\s+/g,' ').trim():'';
    if(!merchant) merchant='Transfer to someone';
  }
  if(!merchant){
    if(type==='transfer') merchant=/سداد|payment/i.test(t)?'Credit card payment':'Transfer';
    else if(type==='income') merchant=/استرداد نقدي|cashback/i.test(t)?'Cashback':(/راتب|salary/i.test(t)?'Salary':'Incoming transfer');
    else merchant='Card purchase';
  }
  // card / account
  let card='';
  const cm=t.match(/^(.{2,40}?)\s+card\s*\(/im)||t.match(/بطاق(?:ة|تك)\s+(.{2,40}?)\s*\(/)||t.match(/^card\s*:\s*([^\n]+)/im);
  if(cm) card=cm[1].replace(/\s+/g,' ').trim();
  // date
  let d=null;
  const dm=t.match(/(\d{4})-(\d{2})-(\d{2})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/)||t.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(dm) d=`${dm[1]}-${dm[2]}-${dm[3]}T${pad2(dm[4]||12)}:${dm[5]||'00'}:${dm[6]||'00'}`;
  else{
    const dm2=t.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
    if(dm2){let y=dm2[3].length===2?'20'+dm2[3]:dm2[3]; d=`${y}-${pad2(dm2[2])}-${pad2(dm2[1])}T${pad2(dm2[4]||12)}:${dm2[5]||'00'}:00`;}
  }
  let noDate=false;
  if(!d){ if(fallbackISO) d=fallbackISO; else { d=localISO(new Date()); noDate=true; } }
  let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))|0;
  const k=[type,amount.toFixed(2),noDate?'h'+h:d,normMerchant(merchant)].join('|');
  const out={k,t:type,a:amount,m:merchant,c:card,d,src:'sms'}; if(p2p) out.p2p=1;
  return out;
}
function parseLooseDate(s){
  if(!s) return null;
  const x=toAsciiDigits(s).replace(/\s+at\s+/i,' ').replace(/ /g,' ').trim();
  if(/SAR|ر\.س/.test(x)) return null;
  const ms=Date.parse(x);
  if(!isNaN(ms)&&x.length<40) return localISO(new Date(ms));
  return null;
}
function splitChunks(text){
  text=String(text||'').replace(/\r/g,'');
  let parts;
  if(/^\s*###\s*$/m.test(text)) parts=text.split(/^\s*###\s*$/m);
  else parts=text.split(/\n\s*\n+/);
  return parts.map(p=>{
    const lines=p.trim().split('\n');
    let date=null;
    if(lines.length>1){const d=parseLooseDate(lines[0]); if(d){date=d; lines.shift();}}
    return {text:lines.join('\n').trim(),date};
  }).filter(c=>c.text);
}
function autoCategory(tx,rules){
  if(tx.t==='income') return 'income';
  if(tx.t==='transfer') return 'transfer';
  const key=normMerchant(tx.m);
  if(rules&&rules[key]) return rules[key];
  if(tx.p2p) return 'people';
  for(const [c,re] of KEYWORDS) if(re.test(tx.m)) return c;
  return 'other';
}

const gSaved=g=>Math.round((g.h||[]).reduce((s,h)=>s+(+h.a||0),0)*100)/100;
function normalize(D){
  D.months=D.months||{}; D.state=Object.assign(defaultState(),D.state||{});
  const st=D.state; st.ru=st.ru||{}; st.gdel=st.gdel||[];
  for(const g of st.goals){
    g.h=(g.h||[]).map(h=>h.id?h:{...h,id:uid()});
    if(typeof g.saved==='number'){ const diff=Math.round((g.saved-gSaved(g))*100)/100; if(diff) g.h.unshift({id:uid(),d:localISO(new Date()).slice(0,10),a:diff,i:1}); delete g.saved; }
  }
  for(const m of Object.values(D.months)){ m.tx=m.tx||[]; m.del=m.del||[];
    for(const t of m.tx) if(t.t==='transfer'&&t.src==='sms'&&!t.u&&t.m!=='Credit card payment'){ t.t='expense'; t.p2p=1; } }
  return D;
}
function mergeData(a,b){
  const out={months:{},state:defaultState()};
  const mk=[...new Set([...Object.keys(a.months||{}),...Object.keys(b.months||{})])].sort();
  for(const k of mk){
    const A=(a.months||{})[k]||{}, B=(b.months||{})[k]||{};
    const del=new Set([...(B.del||[]),...(A.del||[])]);
    const map=new Map();
    for(const t of [...(B.tx||[]),...(A.tx||[])]){ if(del.has(t.k)) continue; const p=map.get(t.k); if(!p||(t.u||0)>(p.u||0)) map.set(t.k,t); }
    out.months[k]={tx:[...map.values()].sort((x,y)=>x.d.localeCompare(y.d)||x.k.localeCompare(y.k)),del:[...del].sort()};
  }
  const sa=a.state||defaultState(), sb=b.state||defaultState();
  out.state.settings=(sa.su||0)>=(sb.su||0)?{...(sa.settings||{})}:{...(sb.settings||{})};
  out.state.su=Math.max(sa.su||0,sb.su||0);
  const rules={...(sb.rules||{})}, ru={...(sb.ru||{})};
  for(const [key,c] of Object.entries(sa.rules||{})){ const ua=(sa.ru||{})[key]||0, ub=ru[key]||0; if(!(key in rules)||ua>=ub){ rules[key]=c; ru[key]=Math.max(ua,ub); } }
  out.state.rules=rules; out.state.ru=ru;
  const gdel=new Set([...(sb.gdel||[]),...(sa.gdel||[])]);
  const gm=new Map();
  for(const g of [...(sb.goals||[]),...(sa.goals||[])]){
    if(gdel.has(g.id)) continue;
    const p=gm.get(g.id);
    if(!p){ gm.set(g.id,{...g,h:[...(g.h||[])]}); continue; }
    const hm=new Map(); for(const h of [...p.h,...(g.h||[])]) hm.set(h.id,h);
    const base=(g.u||0)>(p.u||0)?g:p;
    gm.set(g.id,{...base,h:[...hm.values()].sort((x,y)=>x.d.localeCompare(y.d)||String(x.id).localeCompare(String(y.id)))});
  }
  out.state.goals=[...gm.values()]; out.state.gdel=[...gdel].sort();
  return out;
}

/* ===================== GITHUB SYNC (encrypted) ===================== */
const CFG='mizan-sync', FILE='data.json';
let cfg=null; try{cfg=JSON.parse(localStorage.getItem(CFG)||'null');}catch(e){}
const saveCfg=()=>{try{cfg?localStorage.setItem(CFG,JSON.stringify(cfg)):localStorage.removeItem(CFG);}catch(e){}};
const cfgOK=()=>!!(cfg&&cfg.repo&&cfg.token&&cfg.pass);
const te=new TextEncoder(), td=new TextDecoder();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>{const bin=atob(String(s).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
let keyCache=null; // {pass,salt(b64),iter,key}
async function getKey(pass,saltB64,iter){
  if(keyCache&&keyCache.pass===pass&&keyCache.salt===saltB64&&keyCache.iter===iter) return keyCache.key;
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  keyCache={pass,salt:saltB64,iter,key}; return key;
}
async function encryptData(obj){
  const iter=310000;
  const salt=(keyCache&&keyCache.pass===cfg.pass)?keyCache.salt:b64(crypto.getRandomValues(new Uint8Array(16)));
  const it=(keyCache&&keyCache.pass===cfg.pass)?keyCache.iter:iter;
  const key=await getKey(cfg.pass,salt,it);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
  return JSON.stringify({app:'mizan',v:1,cipher:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter:it,salt,iv:b64(iv),ct:b64(ct)});
}
async function decryptData(text){
  let env; try{env=JSON.parse(text);}catch(e){throw {code:'format'};}
  if(!env||env.app!=='mizan'||!env.ct) throw {code:'format'};
  try{
    const key=await getKey(cfg.pass,env.salt,env.iter);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.ct));
    return JSON.parse(td.decode(pt));
  }catch(e){ keyCache=null; throw {code:'pass'}; }
}
async function gh(path,opts={}){
  let r;
  try{
    r=await fetch(`https://api.github.com/repos/${cfg.repo}${path}`,{...opts,cache:'no-store',headers:{
      'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',
      ...(opts.body?{'Content-Type':'application/json'}:{})}});
  }catch(e){ throw {code:'net'}; }
  if(r.status===401) throw {code:'token'};
  return r;
}
async function pullRemote(){
  const r=await gh('/contents/'+FILE);
  if(r.status===404){ const rr=await gh(''); if(rr.ok) return {data:null,sha:null}; throw {code:'repo'}; }
  if(r.status===403) throw {code:'perm'};
  if(!r.ok) throw {code:'net'};
  const j=await r.json(); let content=j.content;
  if(!content&&j.sha){ const b=await gh('/git/blobs/'+j.sha); if(!b.ok) throw {code:'net'}; content=(await b.json()).content; }
  const data=await decryptData(td.decode(unb64(content||'')));
  return {data,sha:j.sha};
}
async function pushRemote(data,sha){
  const body={message:'Mizan sync',content:b64(te.encode(await encryptData(data)))};
  if(sha) body.sha=sha;
  const r=await gh('/contents/'+FILE,{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422) throw {code:'conflict'};
  if(r.status===403||r.status===404) throw {code:'perm'};
  if(!r.ok) throw {code:'net'};
}
async function pullInbox(){
  const r=await gh('/contents/inbox');
  if(!r.ok) return [];
  const list=(await r.json());
  if(!Array.isArray(list)) return [];
  const out=[];
  for(const f of list.filter(f=>f.type==='file').slice(0,60)){
    const fr=await gh('/contents/inbox/'+encodeURIComponent(f.name));
    if(!fr.ok) continue;
    const j=await fr.json();
    try{ out.push({name:f.name,sha:j.sha,text:td.decode(unb64(j.content||''))}); }catch(e){ out.push({name:f.name,sha:j.sha,text:''}); }
  }
  return out;
}
async function pullIssues(){
  const r=await gh('/issues?state=open&per_page=100');
  if(!r.ok) return [];
  const list=await r.json(); if(!Array.isArray(list)) return [];
  return list.filter(i=>!i.pull_request&&/^\s*sms/i.test(i.title||'')).map(i=>({issue:i.number,name:'',fb:i.created_at?localISO(new Date(i.created_at)):null,text:i.body||''}));
}
function inboxDate(name){
  const m=String(name).match(/(\d{4})(\d{2})(\d{2})-?(\d{2})(\d{2})(\d{2})?/);
  return m?`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]||'00'}`:null;
}
function importInbox(files){
  const existing=new Set(), deleted=new Set();
  for(const m of Object.values(S.months)){(m.tx||[]).forEach(t=>existing.add(t.k));(m.del||[]).forEach(k=>deleted.add(k));}
  let added=0; const touched=new Set();
  for(const f of files){
    const r=parseSMS(f.text,f.fb||inboxDate(f.name));
    if(!r||r.skip||existing.has(r.k)||deleted.has(r.k)) continue;
    existing.add(r.k); const k=monthKey(r.d); M(k).tx.push(r); touched.add(k); added++;
  }
  if(added) saveLocal();
  return added;
}
async function clearInbox(files){
  for(const f of files){ try{
    if(f.issue) await gh('/issues/'+f.issue,{method:'PATCH',body:JSON.stringify({title:'imported',body:'',state:'closed',state_reason:'completed'})});
    else await gh('/contents/inbox/'+encodeURIComponent(f.name),{method:'DELETE',body:JSON.stringify({message:'Mizan imported',sha:f.sha})});
  }catch(e){} }
}
const SYNC_MSG={token:'GitHub token not accepted',repo:'Storage repo not found',perm:'Token can’t write to the repo',pass:'Wrong passphrase',format:'data.json isn’t a Mizan file',net:'Offline — will retry',conflict:'Sync conflict — will retry'};
let syncing=false, syncAgain=false, syncTimer=null, syncErr=null;
function setSync(state,text){ const el=$('#sync'); if(el) el.innerHTML=`<span class="dot ${state}"></span><span>${esc(text)}</span>`; }
function syncIdle(){
  if(!cfgOK()) return setSync('','On this phone');
  if(syncErr) return setSync('off',SYNC_MSG[syncErr]||'Sync error');
  setSync('on',cfg.last?'Synced '+new Date(cfg.last).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'Sync on');
}
function scheduleSync(){ if(!cfgOK()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,2500); }
async function syncNow(){
  if(!cfgOK()) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; clearTimeout(syncTimer); setSync('','Syncing…');
  try{
    let inbox=[], imported=0;
    try{ inbox=await pullInbox(); }catch(e){ if(e&&e.code==='token') throw e; inbox=[]; }
    try{ inbox=inbox.concat(await pullIssues()); }catch(e){ if(e&&e.code==='token') throw e; }
    for(let attempt=0;;attempt++){
      const {data,sha}=await pullRemote();
      if(attempt===0&&inbox.length) imported=importInbox(inbox);
      const before=JSON.stringify({months:S.months,state:S.state});
      const local=JSON.parse(before);
      const nd=data?normalize(data):null;
      const merged=normalize(nd?mergeData(local,nd):mergeData(local,local));
      const remoteNorm=nd?JSON.stringify(normalize(mergeData(nd,nd))):null;
      S.months=merged.months; S.state=merged.state; saveLocal();
      if(JSON.stringify(merged)!==before && !document.querySelector('.backdrop') && document.activeElement?.tagName!=='TEXTAREA' && document.activeElement?.tagName!=='INPUT') render();
      if(remoteNorm===JSON.stringify(merged)) break;
      try{ await pushRemote(merged,sha); break; }
      catch(e){ if(e.code!=='conflict'||attempt>=3) throw e; }
    }
    if(inbox.length) await clearInbox(inbox);
    if(imported) toast(`Imported ${imported} new transaction${imported===1?'':'s'}`);
    syncErr=null; cfg.last=Date.now(); saveCfg();
  }catch(e){ syncErr=(e&&e.code)||'net'; }
  syncing=false; syncIdle();
  if(ui.tab==='setup'&&!document.querySelector('.backdrop')&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA') render();
  if(syncAgain){ syncAgain=false; syncNow(); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncNow(); });
window.addEventListener('online',()=>syncNow());

const catOf=tx=>tx.cat||autoCategory(tx,S.state.rules);
const txOf=k=>(S.months[k]&&S.months[k].tx)||[];
function monthTotals(k){
  let spent=0,refunds=0,income=0,byCat={};
  for(const t of txOf(k)){
    if(t.t==='expense'){spent+=t.a;const c=catOf(t);byCat[c]=(byCat[c]||0)+t.a;}
    else if(t.t==='refund'){refunds+=t.a;const c=catOf(t);byCat[c]=(byCat[c]||0)-t.a;}
    else if(t.t==='income') income+=t.a;
  }
  return {spent:spent-refunds,gross:spent,refunds,income,byCat,count:txOf(k).filter(t=>t.t==='expense').length};
}
function savedInMonth(k){let s=0;for(const g of S.state.goals)for(const h of (g.h||[]))if(!h.i&&h.d.slice(0,7)===k)s+=h.a;return s;}
function goalEta(g){
  const left=(g.price||0)-gSaved(g);
  if(!g.price) return '';
  if(left<=0) return 'Ready to buy! 🎉';
  if(!g.monthly) return `${fmt(left)} SAR to go`;
  const n=Math.ceil(left/g.monthly);

function vGoals(){
  const g=S.state.goals;
  const total=g.reduce((s,x)=>s+gSaved(x),0), planned=g.reduce((s,x)=>s+(+x.monthly||0),0);
  const list=g.map(x=>{
    const pct=x.price?Math.min(gSaved(x)/x.price*100,100):0;
    return `<div class="goal"><div class="t"><div class="em">${esc(x.emoji||'⭐')}</div><div style="flex:1;min-width:0"><div class="row"><span class="nm">${esc(x.name)}</span><button class="x" data-editgoal="${x.id}">✎</button></div>
    <div class="eta num">${fmt(gSaved(x))}${x.price?' / '+fmt(x.price):''} SAR${x.monthly?' · '+fmt(x.monthly)+'/mo':''}</div></div></div>
    ${x.price?`<div class="meter"><i style="width:${pct}%"></i></div>`:''}
    <div class="eta">${esc(goalEta(x))}</div>
    <div class="btns"><button class="btn sm" data-contrib="${x.id}">＋ Add money</button><button class="btn sm ghost" data-withdraw="${x.id}">− Take out</button></div></div>`;
  }).join('');
  return `<div class="card"><h2>Savings</h2><div class="big"><small>SAR</small>${money(total)}</div><div class="sub">Planned: ${fmt(planned)} SAR per month across ${g.length} goal${g.length===1?'':'s'}</div></div>
  <div class="card"><h2>Goals & dream items</h2>${list||`<div class="empty">Add something you're saving for — an emergency fund, a new phone, a trip.</div>`}</div>
  <button class="btn" data-act="addgoal">＋ New goal</button>`;
}

    ${syncErr?`<div class="banner" style="margin-top:8px">${esc(SYNC_MSG[syncErr]||'Sync error')}${syncErr==='pass'?' — it must match the passphrase used on your other devices.':''}</div>`:''}
    <p class="note">Your data is encrypted on this device with your passphrase before it's uploaded to <code class="mono">${FILE}</code>.</p>

  </div></details>

  <div class="card"><h2>Paste messages manually</h2>
    <label>Paste your bank messages (leave a blank line between them)</label>
    <textarea id="paste" placeholder="SAB mada(Apple Pay) Card (1234) … was used at … for SAR 24.00 on 2026-11-14 00:17:42"></textarea>

    <label>Salary / income per month (SAR) — optional, used for "left to spend"</label>
    <input id="income" type="number" inputmode="decimal" value="${+S.state.settings.income||''}" placeholder="e.g. 8000">

  <div class="card"><h2>Remembered merchants</h2>${rules.length?rules.map(([m,c])=>`<div class="rule"><span>${esc(m)} → ${CATS[c]?.e||''} ${esc(CATS[c]?.n||c)}</span><button class="x" data-delrule="${esc(m)}">×</button></div>`).join(''):'<div class="note">When you change a transaction\'s category, Mizan remembers it for that merchant.</div>'}</div>

  <div class="card"><h2>Backup</h2><p class="note" style="margin-top:0;margin-bottom:8px">${cfgOK()?'Sync keeps an encrypted copy in GitHub. A manual backup is still a good extra safety net.':'Without sync, your data is stored only in this browser on your phone. Copy a backup now and then and keep it in Notes, in case the browser data is cleared.'}</p>
    <div class="btns" style="margin-top:0"><button class="btn ghost" data-act="copybackup">Copy backup</button><button class="btn ghost" data-act="restore">Restore</button></div>

/* ===================== INTERACTIONS ===================== */
function bindView(){
  const v=$('#view');
  v.onclick=e=>{
    const el=e.target.closest('[data-act],[data-cat],[data-filter],[data-k],[data-go],[data-contrib],[data-withdraw],[data-editgoal],[data-delrule]');
    if(!el) return;
    const d=el.dataset;
    if(d.act==='prev'){ui.month=addMonth(ui.month,-1);render();}
    else if(d.act==='next'){ui.month=addMonth(ui.month,1);render();}
    else if(d.go){ui.tab=d.go;render();}
    else if(d.cat){ui.tab='tx';ui.filter=d.cat;render();window.scrollTo(0,0);}
    else if(d.filter){ui.filter=d.filter;render();}
    else if(d.k) editTx(d.k);
    else if(d.act==='addtx') addTx();
    else if(d.act==='addgoal') editGoal();
    else if(d.editgoal) editGoal(d.editgoal);
    else if(d.contrib) contrib(d.contrib,1);
    else if(d.withdraw) contrib(d.withdraw,-1);
    else if(d.act==='parsepaste'){const r=doImport($('#paste').value);showImport(r);if(r.added)$('#paste').value='';}
    else if(d.act==='saveincome'){S.state.settings.income=+$('#income').value||0;S.state.su=Date.now();saveState();toast('Saved');}
    else if(d.delrule){S.state.rules[d.delrule]=null;S.state.ru[d.delrule]=Date.now();saveState();render();}
    else if(d.act==='copybackup') copyBackup();
    else if(d.act==='copyurl'){ const t=$('#inboxurl').textContent; navigator.clipboard.writeText(t).then(()=>toast('URL copied'),()=>{const r=document.createRange();r.selectNodeContents($('#inboxurl'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Press and hold to copy');}); }
    else if(d.act==='connect'){
      const repo=$('#sy-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
      const token=$('#sy-token').value.trim(), pass=$('#sy-pass').value;
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){toast('Enter the repo as username/repo');return;}
      if(!token){toast('Paste your access token');return;}
      if(pass.length<8){toast('Use a passphrase of at least 8 characters');return;}
      cfg={repo,token,pass}; saveCfg(); keyCache=null; syncErr=null; document.activeElement?.blur(); render(); toast('Connecting…');
      syncNow().then(()=>{ if(syncErr) toast(SYNC_MSG[syncErr]); else toast('Synced ✓'); render(); });
    }
    else if(d.act==='syncnow'){ syncNow().then(()=>toast(syncErr?SYNC_MSG[syncErr]:'Synced ✓')); }
    else if(d.act==='disconnect'){
      if(el.dataset.sure){ cfg=null; saveCfg(); keyCache=null; syncErr=null; syncIdle(); render(); toast('Disconnected — data stays on this device'); }
      else{ el.dataset.sure=1; el.textContent='Tap again to disconnect'; }
    }
    else if(d.act==='restore') restoreUI();
  };
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.t;if(ui.tab!=='tx')ui.filter='all';render();window.scrollTo(0,0);};
function doImport(text){
  const chunks=splitChunks(text);
  const existing=new Set(), deleted=new Set();
  for(const m of Object.values(S.months)){(m.tx||[]).forEach(t=>existing.add(t.k));(m.del||[]).forEach(k=>deleted.add(k));}
  let added=0,dup=0;const bad=[],touched=new Set();
  for(const c of chunks){
    const r=parseSMS(c.text,c.date);
    if(!r||r.skip){bad.push(c.text);continue;}
    if(existing.has(r.k)||deleted.has(r.k)){dup++;continue;}
    existing.add(r.k); const k=monthKey(r.d); M(k).tx.push(r); touched.add(k); added++;
  }
  touched.forEach(saveMonth);
  if(touched.size){ const latest=[...touched].sort().pop(); if(added) ui.month=latest>nowKey()?nowKey():latest; }
  return {added,dup,bad};
}
function showImport(r){
  const box=$('#importres'); if(!box) return;
  box.innerHTML=`<p class="note" style="color:var(--ink)"><b>${r.added}</b> added · ${r.dup} already there · ${r.bad.length} ignored</p>
  ${r.bad.length?`<details style="margin-top:6px"><summary>Show ignored messages</summary><div class="badlist">${r.bad.slice(0,15).map(b=>`<div>${esc(b.slice(0,220))}</div>`).join('')}</div><p class="note">OTPs, statements, payment confirmations and alerts with no amount are skipped on purpose.</p></details>`:''}`;
  if(r.added) toast(`Added ${r.added} transaction${r.added===1?'':'s'}`);
}
function findTx(k){for(const [mk,m] of Object.entries(S.months)){const i=(m.tx||[]).findIndex(t=>t.k===k);if(i>=0)return {mk,i,t:m.tx[i]};}return null;}

/* ---------- sheets ---------- */
function sheet(html,onMount){
  const bd=document.createElement('div');bd.className='backdrop';
  bd.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  bd.onclick=e=>{if(e.target===bd)bd.remove();};
  document.body.appendChild(bd);
  const close=()=>bd.remove();
  onMount&&onMount(bd.querySelector('.sheet'),close);
}
function catGrid(sel,list){return `<div class="catgrid">${list.map(c=>`<button data-c="${c}" class="${c===sel?'on':''}"><span class="e">${CATS[c].e}</span>${CATS[c].n}</button>`).join('')}</div>`;}
function editTx(k){
  const f=findTx(k); if(!f) return; const t=f.t; let sel=catOf(t), type=t.t;
  sheet(`<h3>${esc(t.m)}</h3><div class="sub num">${fmt(t.a)} SAR · ${t.d.replace('T',' ').slice(0,16)}${t.c?' · '+esc(t.c):''}</div>
    <label>Type</label><div class="seg" id="seg">${['expense','refund','income','transfer'].map(x=>`<button data-ty="${x}" class="${x===type?'on':''}">${{expense:'Spending',refund:'Refund',income:'Income',transfer:'Transfer'}[x]}</button>`).join('')}</div>
    <div id="catwrap"><label>Category</label>${catGrid(sel,SPEND_CATS)}
    <label class="check"><input type="checkbox" id="remember" checked> Always use this for “${esc(t.m.slice(0,30))}”</label></div>
    <div class="btns"><button class="btn danger" id="del">Delete</button><button class="btn" id="ok">Save</button></div>`,
  (el,close)=>{
    const sync=()=>{el.querySelector('#catwrap').style.display=(type==='expense'||type==='refund')?'':'none';};sync();
    el.querySelector('#seg').onclick=e=>{const b=e.target.closest('[data-ty]');if(!b)return;type=b.dataset.ty;el.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));sync();};
    el.querySelector('.catgrid').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;sel=b.dataset.c;el.querySelectorAll('.catgrid button').forEach(x=>x.classList.toggle('on',x===b));};
    el.querySelector('#ok').onclick=()=>{
      const ff=findTx(k); if(!ff){close();return;} const tx=ff.t; tx.u=Date.now();
      if(type!==tx.t){tx.t=type;}
      if(type==='expense'||type==='refund'){
        if(el.querySelector('#remember').checked){const mk=normMerchant(tx.m);S.state.rules[mk]=sel;S.state.ru[mk]=Date.now();delete tx.cat;saveState();}
        else tx.cat=sel;
      } else delete tx.cat;
      saveMonth(ff.mk);close();render();
    };
    el.querySelector('#del').onclick=()=>{
      const b=el.querySelector('#del');
      if(b.dataset.sure){const ff=findTx(k);if(ff){const m=S.months[ff.mk];m.tx.splice(ff.i,1);m.del=m.del||[];m.del.push(k);saveMonth(ff.mk);}close();render();toast('Deleted');}
      else{b.dataset.sure=1;b.textContent='Tap again to delete';}
    };
  });
}
function addTx(){
  let sel='food', type='expense';
  const today=localISO(new Date()).slice(0,10);
  sheet(`<h3>Add entry</h3>
    <div class="seg" id="seg"><button data-ty="expense" class="on">Spending</button><button data-ty="income">Income</button></div>
    <label>Amount (SAR)</label><input id="amt" type="number" inputmode="decimal" placeholder="0.00">
    <label>What / where</label><input id="mer" placeholder="e.g. Barber, cash">
    <label>Date</label><input id="dt" type="date" value="${today}">
    <div id="catwrap"><label>Category</label>${catGrid(sel,SPEND_CATS)}</div>
    <div class="btns"><button class="btn" id="ok">Add</button></div>`,
  (el,close)=>{
    el.querySelector('#seg').onclick=e=>{const b=e.target.closest('[data-ty]');if(!b)return;type=b.dataset.ty;el.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));el.querySelector('#catwrap').style.display=type==='expense'?'':'none';};
    el.querySelector('.catgrid').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;sel=b.dataset.c;el.querySelectorAll('.catgrid button').forEach(x=>x.classList.toggle('on',x===b));};
    el.querySelector('#ok').onclick=()=>{
      const a=parseFloat(el.querySelector('#amt').value); if(!(a>0)){el.querySelector('#amt').focus();return;}
      const m=el.querySelector('#mer').value.trim()||(type==='expense'?'Cash':'Income');
      const d=(el.querySelector('#dt').value||today)+'T'+localISO(new Date()).slice(11);
      const tx={k:'man|'+uid(),t:type,a,m,c:'Manual',d,src:'manual'}; if(type==='expense')tx.cat=sel;
      const k=monthKey(d); M(k).tx.push(tx); saveMonth(k); ui.month=k; close(); render(); toast('Added');
    };
  });
}
function editGoal(id){
  const g=id?S.state.goals.find(x=>x.id===id):null;
  sheet(`<h3>${g?'Edit goal':'New goal'}</h3>
    <label>Name</label><input id="gn" value="${esc(g?.name||'')}" placeholder="e.g. MacBook Air, Emergency fund">
    <div class="row" style="gap:10px"><div style="width:90px"><label>Emoji</label><input id="ge" value="${esc(g?.emoji||'⭐')}" maxlength="4"></div>
    <div style="flex:1"><label>Price / target (SAR)</label><input id="gp" type="number" inputmode="decimal" value="${g?.price||''}" placeholder="optional"></div></div>
    <label>Monthly contribution (SAR)</label><input id="gm" type="number" inputmode="decimal" value="${g?.monthly||''}" placeholder="e.g. 500">
    ${g?'':`<label>Already saved (SAR)</label><input id="gs" type="number" inputmode="decimal" placeholder="0">`}
    <div class="btns">${g?'<button class="btn danger" id="gdel">Delete</button>':''}<button class="btn" id="ok">${g?'Save':'Create goal'}</button></div>`,
  (el,close)=>{
    el.querySelector('#ok').onclick=()=>{
      const name=el.querySelector('#gn').value.trim(); if(!name){el.querySelector('#gn').focus();return;}
      const upd={name,emoji:el.querySelector('#ge').value.trim()||'⭐',price:+el.querySelector('#gp').value||0,monthly:+el.querySelector('#gm').value||0};
      upd.u=Date.now(); if(g) Object.assign(g,upd);
      else{const s=+(el.querySelector('#gs').value)||0;S.state.goals.push({id:uid(),...upd,h:s?[{id:uid(),d:localISO(new Date()).slice(0,10),a:s,i:1}]:[]});}
      saveState();close();render();
    };
    const del=el.querySelector('#gdel');
    if(del) del.onclick=()=>{if(del.dataset.sure){S.state.goals=S.state.goals.filter(x=>x.id!==id);S.state.gdel.push(id);saveState();close();render();}else{del.dataset.sure=1;del.textContent='Tap again to delete';}};
  });
}
function contrib(id,dir){
  const g=S.state.goals.find(x=>x.id===id); if(!g) return;
  sheet(`<h3>${dir>0?'Add money to':'Take money from'} ${esc(g.name)}</h3><div class="sub num">Currently ${fmt(gSaved(g))} SAR</div>
    <label>Amount (SAR)</label><input id="ca" type="number" inputmode="decimal" value="${dir>0&&g.monthly?g.monthly:''}">
    <div class="btns"><button class="btn" id="ok">${dir>0?'Add':'Take out'}</button></div>`,
  (el,close)=>{
    el.querySelector('#ok').onclick=()=>{
      const a=parseFloat(el.querySelector('#ca').value); if(!(a>0)) return;
      const amt=dir>0?a:-Math.min(a,gSaved(g));
      g.h=(g.h||[]).concat([{id:uid(),d:localISO(new Date()).slice(0,10),a:amt}]);
      saveState();close();render();toast(dir>0?'Nice — saved!':'Updated');
    };
  });
}
async function copyBackup(){
  const txt=JSON.stringify({app:'mizan',v:1,months:S.months,state:S.state});
  try{await navigator.clipboard.writeText(txt);toast('Backup copied — paste it into Notes to keep it safe.');}
  catch(e){$('#backupbox').innerHTML=`<label>Copy this text and keep it somewhere safe</label><textarea readonly>${esc(txt)}</textarea>`;const ta=$('#backupbox textarea');ta.focus();ta.select();}
}
function restoreUI(){
  sheet(`<h3>Restore backup</h3><div class="sub">Paste a backup you copied earlier. It's merged with what's already here.</div><textarea id="rb"></textarea><div class="btns"><button class="btn" id="ok">Restore</button></div>`,(el,close)=>{
    el.querySelector('#ok').onclick=()=>{
      try{
        const j=JSON.parse(el.querySelector('#rb').value); if(j.app!=='mizan') throw 0;
        const merged=normalize(mergeData(JSON.parse(JSON.stringify({months:S.months,state:S.state})),normalize({months:j.months,state:j.state})));
        S.months=merged.months; S.state=merged.state;
        saveState();close();render();toast('Restored');
      }catch(e){toast('That doesn’t look like a Mizan backup.');}
    };
  });
}
let toastT;
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}

loadLocal(); render(); syncIdle(); syncNow();
